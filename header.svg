<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E2A2E"/>
      <stop offset="1" stop-color="#16443F"/>
    </linearGradient>
    <radialGradient id="light" cx="0.85" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#F5B83D" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#F5B83D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5B83D" stop-opacity="0"/>
      <stop offset="1" stop-color="#F5B83D" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9FB8B4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C9B37E" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#9FB8B4" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="1200" height="320" rx="18"/></clipPath>
    <style>
      .name { font: 700 64px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #F4EFE3; letter-spacing: -1px; }
      .tag  { font: 700 17px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #F5B83D; letter-spacing: 3.5px; }
      .meta { font: 400 16px 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #B9CCC8; }
      .mono { font: 400 11px 'SFMono-Regular', Consolas, 'Courier New', monospace; fill: #7FA19C; letter-spacing: 2px; }
      .spin  { animation: spin 40s linear infinite; transform-origin: 1040px 135px; }
      .spinr { animation: spin 26s linear infinite reverse; transform-origin: 1040px 135px; }
      .sweep { animation: spin 6s linear infinite; transform-origin: 1040px 135px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .bar { animation: bar 4s ease-in-out infinite; transform-origin: 86px 0; }
      @keyframes bar { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(1.8); } }
      .live { animation: live 2s ease-in-out infinite; }
      @keyframes live { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#light)"/>

    <!-- left: identity -->
    <rect class="bar" x="86" y="70" width="50" height="4" rx="2" fill="#F5B83D"/>
    <text class="name" x="84" y="152">Ayyoub Sghuri</text>
    <text class="tag" x="88" y="198">FULL-STACK DEVELOPER · PYTHON · .NET</text>
    <text class="meta" x="88" y="252">github.com/Ayyoubsghuri</text>
    <circle class="live" cx="300" cy="247" r="4" fill="#4ADE80"/>
    <text class="meta" x="312" y="252" fill-opacity="0.85">Open to work</text>

    <!-- right: radar mark -->
    <g fill="none">
      <circle cx="1040" cy="135" r="96" stroke="#F5B83D" stroke-opacity="0.18"/>
      <circle class="spin" cx="1040" cy="135" r="76" stroke="#F5B83D" stroke-width="1.5" stroke-opacity="0.85" stroke-dasharray="120 14 6 14"/>
      <circle class="spinr" cx="1040" cy="135" r="50" stroke="#C9B37E" stroke-opacity="0.55" stroke-dasharray="3 7"/>
      <path class="sweep" d="M1040 135 L1116 135 A76 76 0 0 0 1094 81 Z" fill="url(#sweep)" stroke="none"/>
      <line x1="944" y1="135" x2="1136" y2="135" stroke="#FFFFFF" stroke-opacity="0.06"/>
      <line x1="1040" y1="39" x2="1040" y2="231" stroke="#FFFFFF" stroke-opacity="0.06"/>
    </g>
    <circle cx="1040" cy="135" r="9" fill="#F5B83D">
      <animate attributeName="r" values="8;10;8" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1040" cy="135" r="9" fill="none" stroke="#F5B83D">
      <animate attributeName="r" values="9;40" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.6;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" fill="#F4EFE3">
      <animateMotion dur="9s" repeatCount="indefinite" path="M1116 135 A76 76 0 1 1 964 135 A76 76 0 1 1 1116 135"/>
    </circle>

    <!-- bottom-right detail -->
    <line x1="960" y1="262" x2="1124" y2="262" stroke="url(#rule)" stroke-width="2"/>
    <text class="mono" x="1042" y="284" text-anchor="middle">BASED IN MOROCCO</text>
  </g>
</svg>
